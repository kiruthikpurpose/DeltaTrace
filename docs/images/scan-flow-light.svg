<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 150" width="1050" height="150" role="img" aria-label="Processing stages of one scan" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Processing stages of one scan</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#6e7781"/></marker>
<marker id="ac" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#0969da"/></marker></defs>
<rect x="10" y="40" width="124" height="60" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="72" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Sample</text>
<text x="72" y="83" text-anchor="middle" font-size="11" fill="#59636e">15 channels</text>
<text x="22" y="34" font-size="11" font-weight="600" fill="#59636e">1</text>
<path d="M134,70 H154" fill="none" stroke="#6e7781" stroke-width="1.5"  marker-end="url(#a)"/>
<rect x="154" y="40" width="124" height="60" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="216" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">SCADA alarms</text>
<text x="216" y="83" text-anchor="middle" font-size="11" fill="#59636e">limits, rate, balance</text>
<text x="166" y="34" font-size="11" font-weight="600" fill="#59636e">2</text>
<path d="M278,70 H298" fill="none" stroke="#6e7781" stroke-width="1.5"  marker-end="url(#a)"/>
<rect x="298" y="40" width="124" height="60" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="360" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Trust</text>
<text x="360" y="83" text-anchor="middle" font-size="11" fill="#59636e">score per channel</text>
<text x="310" y="34" font-size="11" font-weight="600" fill="#59636e">3</text>
<path d="M422,70 H442" fill="none" stroke="#6e7781" stroke-width="1.5"  marker-end="url(#a)"/>
<rect x="442" y="40" width="124" height="60" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="504" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Group</text>
<text x="504" y="83" text-anchor="middle" font-size="11" fill="#59636e">delay window</text>
<text x="454" y="34" font-size="11" font-weight="600" fill="#59636e">4</text>
<path d="M566,70 H586" fill="none" stroke="#6e7781" stroke-width="1.5"  marker-end="url(#a)"/>
<rect x="586" y="40" width="124" height="60" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="648" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Classify</text>
<text x="648" y="83" text-anchor="middle" font-size="11" fill="#59636e">rank, origin</text>
<text x="598" y="34" font-size="11" font-weight="600" fill="#59636e">5</text>
<path d="M710,70 H730" fill="none" stroke="#6e7781" stroke-width="1.5"  marker-end="url(#a)"/>
<rect x="730" y="40" width="124" height="60" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="792" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Safety rules</text>
<text x="792" y="83" text-anchor="middle" font-size="11" fill="#59636e">demote, headline</text>
<text x="742" y="34" font-size="11" font-weight="600" fill="#59636e">6</text>
<path d="M854,70 H874" fill="none" stroke="#6e7781" stroke-width="1.5"  marker-end="url(#a)"/>
<rect x="874" y="40" width="124" height="60" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="936" y="67" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Write-back</text>
<text x="936" y="83" text-anchor="middle" font-size="11" fill="#59636e">audit, KPIs</text>
<text x="886" y="34" font-size="11" font-weight="600" fill="#59636e">7</text>
<text x="520" y="130" text-anchor="middle" font-size="11" fill="#59636e">One scan every 5 simulated seconds. Highlighted stages are DeltaTrace.</text>
</svg>
