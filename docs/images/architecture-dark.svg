<path d="M955,98 V128" fill="none" stroke="#58a6ff" stroke-width="1.5"  marker-end="url(#ac)"/>
<path d="M815,180 V210" fill="none" stroke="#58a6ff" stroke-width="1.5"  marker-end="url(#ac)"/>
<path d="M955,180 V210" fill="none" stroke="#58a6ff" stroke-width="1.5"  marker-end="url(#ac)"/>
<path d="M815,262 V292" fill="none" stroke="#58a6ff" stroke-width="1.5"  marker-end="url(#ac)"/>
<path d="M955,262 V292" fill="none" stroke="#58a6ff" stroke-width="1.5"  marker-end="url(#ac)"/>
<path d="M815,344 V372" fill="none" stroke="#58a6ff" stroke-width="1.5"  marker-end="url(#ac)"/>
<path d="M955,344 V372" fill="none" stroke="#58a6ff" stroke-width="1.5"  marker-end="url(#ac)"/>
<path d="M750,398 H600 Q575,398 575,372 V246" fill="none" stroke="#58a6ff" stroke-width="1.5"  marker-end="url(#ac)"/>
<text x="608" y="390" text-anchor="start" font-size="11" fill="#8d96a0">approved write-back</text>
</svg>
