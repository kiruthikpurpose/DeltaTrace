<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 490" width="1050" height="490" role="img" aria-label="DeltaTrace system architecture" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>DeltaTrace system architecture</title>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/></marker>
<marker id="ac" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#58a6ff"/></marker></defs>
<rect x="10" y="10" width="200" height="300" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4"/>
<text x="24" y="32" font-size="11" font-weight="600" letter-spacing="0.8" fill="#8d96a0">FIELD</text>
<rect x="230" y="10" width="200" height="300" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4"/>
<text x="244" y="32" font-size="11" font-weight="600" letter-spacing="0.8" fill="#8d96a0">COMMUNICATION</text>
<rect x="450" y="10" width="250" height="300" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4"/>
<text x="464" y="32" font-size="11" font-weight="600" letter-spacing="0.8" fill="#8d96a0">CONTROL CENTRE</text>
<rect x="730" y="10" width="310" height="470" rx="8" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="0"/>
<text x="744" y="32" font-size="11" font-weight="600" letter-spacing="0.8" fill="#58a6ff">DELTATRACE</text>
<rect x="30" y="60" width="160" height="56" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="110" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Pipeline and sensors</text>
<text x="110" y="101" text-anchor="middle" font-size="11" fill="#8d96a0">12 pressure, 3 flow</text>
<rect x="30" y="190" width="160" height="56" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="110" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">RTUs / PLCs</text>
<text x="110" y="231" text-anchor="middle" font-size="11" fill="#8d96a0">sample, stamp, quality</text>
<rect x="250" y="190" width="160" height="56" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="330" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Links and protocols</text>
<text x="330" y="231" text-anchor="middle" font-size="11" fill="#8d96a0">radio, OPC UA, DNP3</text>
<rect x="470" y="190" width="210" height="56" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="575" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">SCADA server</text>
<text x="575" y="231" text-anchor="middle" font-size="11" fill="#8d96a0">alarms, historian, time</text>
<rect x="470" y="60" width="210" height="56" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="575" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Operator console</text>
<text x="575" y="101" text-anchor="middle" font-size="11" fill="#8d96a0">alarm list or incidents</text>
<rect x="750" y="50" width="270" height="48" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="885" y="71" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Read-only gateway</text>
<text x="885" y="87" text-anchor="middle" font-size="11" fill="#8d96a0">data in only</text>
<rect x="750" y="128" width="130" height="52" rx="6" fill="#10243e" stroke="#58a6ff" stroke-width="1.2"/>
<text x="815" y="151" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Trust engine</text>
<text x="815" y="167" text-anchor="middle" font-size="11" fill="#8d96a0">function 1</text>
<rect x="890" y="128" width="130" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="955" y="151" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Pipeline map</text>
<text x="955" y="167" text-anchor="middle" font-size="11" fill="#8d96a0">topology, delays</text>
<rect x="750" y="210" width="270" height="52" rx="6" fill="#10243e" stroke="#58a6ff" stroke-width="1.2"/>
<text x="885" y="233" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Grouping and classification</text>
<text x="885" y="249" text-anchor="middle" font-size="11" fill="#8d96a0">function 2</text>
<rect x="750" y="292" width="130" height="52" rx="6" fill="#10243e" stroke="#58a6ff" stroke-width="1.2"/>
<text x="815" y="315" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Replay tuner</text>
<text x="815" y="331" text-anchor="middle" font-size="11" fill="#8d96a0">function 3</text>
<rect x="890" y="292" width="130" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="955" y="315" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Audit log</text>
<text x="955" y="331" text-anchor="middle" font-size="11" fill="#8d96a0">every decision</text>
<rect x="750" y="372" width="270" height="52" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.2"/>
<text x="885" y="395" text-anchor="middle" font-size="13" font-weight="600" fill="#e6edf3">Write-back module</text>
<text x="885" y="411" text-anchor="middle" font-size="11" fill="#8d96a0">incidents, flags, approved settings</text>
<text x="885" y="458" text-anchor="middle" font-size="11" fill="#8d96a0">Dry-run write-back. No control commands.</text>
<path d="M110,116 V190" fill="none" stroke="#8b949e" stroke-width="1.5"  marker-end="url(#a)"/>
