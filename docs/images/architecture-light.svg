<text x="955" y="151" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Pipeline map</text>
<text x="955" y="167" text-anchor="middle" font-size="11" fill="#59636e">topology, delays</text>
<rect x="750" y="210" width="270" height="52" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="885" y="233" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Grouping and classification</text>
<text x="885" y="249" text-anchor="middle" font-size="11" fill="#59636e">function 2</text>
<rect x="750" y="292" width="130" height="52" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="815" y="315" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Replay tuner</text>
<text x="815" y="331" text-anchor="middle" font-size="11" fill="#59636e">function 3</text>
<rect x="890" y="292" width="130" height="52" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="955" y="315" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Audit log</text>
<text x="955" y="331" text-anchor="middle" font-size="11" fill="#59636e">every decision</text>
<rect x="750" y="372" width="270" height="52" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="885" y="395" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Write-back module</text>
<text x="885" y="411" text-anchor="middle" font-size="11" fill="#59636e">incidents, flags, approved settings</text>
<text x="885" y="458" text-anchor="middle" font-size="11" fill="#59636e">Dry-run write-back. No control commands.</text>
