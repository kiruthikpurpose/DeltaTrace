<text x="744" y="32" font-size="11" font-weight="600" letter-spacing="0.8" fill="#0969da">DELTATRACE</text>
<rect x="30" y="60" width="160" height="56" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="110" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Pipeline and sensors</text>
<text x="110" y="101" text-anchor="middle" font-size="11" fill="#59636e">12 pressure, 3 flow</text>
<rect x="30" y="190" width="160" height="56" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="110" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">RTUs / PLCs</text>
<text x="110" y="231" text-anchor="middle" font-size="11" fill="#59636e">sample, stamp, quality</text>
<rect x="250" y="190" width="160" height="56" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="330" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Links and protocols</text>
<text x="330" y="231" text-anchor="middle" font-size="11" fill="#59636e">radio, OPC UA, DNP3</text>
<rect x="470" y="190" width="210" height="56" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="575" y="215" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">SCADA server</text>
<text x="575" y="231" text-anchor="middle" font-size="11" fill="#59636e">alarms, historian, time</text>
<rect x="470" y="60" width="210" height="56" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="575" y="85" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Operator console</text>
<text x="575" y="101" text-anchor="middle" font-size="11" fill="#59636e">alarm list or incidents</text>
<rect x="750" y="50" width="270" height="48" rx="6" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.2"/>
<text x="885" y="71" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Read-only gateway</text>
<text x="885" y="87" text-anchor="middle" font-size="11" fill="#59636e">data in only</text>
<rect x="750" y="128" width="130" height="52" rx="6" fill="#ddf4ff" stroke="#0969da" stroke-width="1.2"/>
<text x="815" y="151" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Trust engine</text>
<text x="815" y="167" text-anchor="middle" font-size="11" fill="#59636e">function 1</text>
