<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>DeltaTrace Live — fewer alarms, clearer incidents, safer settings</title>
    <meta name="description" content="DeltaTrace Live is an in-browser simulation showing how trust scoring, delay-based incident grouping and trust-gated alarm tuning calm alarm floods on an oil and gas pipeline. Simulated data — demonstration only." />
    <meta property="og:title" content="DeltaTrace Live" />
    <meta property="og:description" content="Fewer alarms. Clearer incidents. Safer settings. A simulated pipeline control-room demo." />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="color-scheme" content="light dark" />
    <script>try{var t=localStorage.getItem("deltatrace.v1.theme");t=t?JSON.parse(t):(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
    <style>
      #splash{position:fixed;inset:0;z-index:1000;background:#14171b;color:#e8eaed;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;transition:background .8s ease}
      .sp-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
      .sp-name{position:absolute;left:0;right:0;text-align:center;font-weight:600;letter-spacing:-.035em;opacity:0;filter:blur(8px);transform:translateY(10px);transition:opacity 1s cubic-bezier(.16,1,.3,1),transform 1s cubic-bezier(.16,1,.3,1),filter 1s}
      .sp-nt{display:inline-block;transform-origin:0 0}.sp-name .l{font-weight:300}.sp-name.on{opacity:1;filter:none;transform:none}.sp-name.off{opacity:0;transition-duration:.45s}
      .sp-sub{position:absolute;left:0;right:0;text-align:center;color:#8d949c;opacity:0;transition:opacity 1s}.sp-sub.on{opacity:1}.sp-sub.off{opacity:0;transition-duration:.45s}
      .sp-credit{position:absolute;bottom:34px;left:0;right:0;text-align:center;font-size:12px;letter-spacing:.04em;color:#8d949c;opacity:0;transition:opacity 1s}.sp-credit.on{opacity:1}.sp-credit.off{opacity:0;transition-duration:.4s}
      .sp-hint{position:absolute;bottom:62px;left:0;right:0;display:flex;gap:7px;align-items:center;justify-content:center;font-size:12px;letter-spacing:.02em;color:#6c7580;opacity:0;animation:sph 1s ease forwards}
      @keyframes sph{to{opacity:1}}
      .splash-on body{overflow:hidden}
      .splash-on #brand-logo{visibility:hidden}
      .splash-on #brand-name{visibility:hidden}
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"></div>
    <script>try{if(sessionStorage.getItem("deltatrace.splash")){document.getElementById("splash").remove()}else{document.documentElement.classList.add("splash-on")}}catch(e){}</script>
    <script src="/splash-audio.js"></script>
    <script src="/splash.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
