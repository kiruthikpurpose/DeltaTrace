<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>DeltaTrace Live — fewer alarms, clearer incidents, safer settings</title>
    <meta name="description" content="DeltaTrace Live is an in-browser simulation showing how trust scoring, delay-based incident grouping and trust-gated alarm tuning calm alarm floods on an oil and gas pipeline. Simulated data — demonstration only." />
    <meta property="og:title" content="DeltaTrace Live" />
    <meta property="og:description" content="Fewer alarms. Clearer incidents. Safer settings. A simulated pipeline control-room demo." />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="color-scheme" content="light dark" />
    <script>try{var t=localStorage.getItem("deltatrace.v1.theme");t=t?JSON.parse(t):(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t}catch(e){}</script>
    <style>
      #splash{position:fixed;inset:0;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;transition:opacity .8s cubic-bezier(.32,.72,0,1),transform .8s cubic-bezier(.32,.72,0,1),filter .8s cubic-bezier(.32,.72,0,1);--line:#c9ccd1;--accent:#2c6ca3;--muted:#6e6e73;--track:rgba(0,0,0,.1)}
      :root[data-theme="dark"] #splash{background:#0a0b0d;color:#f5f5f7;--line:#3a3f46;--accent:#5b9fd6;--muted:#8d9299;--track:rgba(255,255,255,.12)}
      #splash.leaving{opacity:0;transform:scale(1.035);filter:blur(6px);pointer-events:none}
      .splash-on body{overflow:hidden}
      .sp-stage{display:flex;flex-direction:column;align-items:center;transform:translateY(-14px)}
      .sp-mark{overflow:visible;animation:sp-lift 1.1s 1.55s cubic-bezier(.16,1,.3,1) both}
      .sp-line{stroke:var(--line);stroke-width:3;stroke-dasharray:1;stroke-dashoffset:1;animation:sp-draw 1s .25s cubic-bezier(.65,0,.35,1) forwards}
      .sp-r{animation-delay:.25s}
      .sp-pulse{stroke:var(--accent);stroke-width:3.5;stroke-dasharray:1;stroke-dashoffset:1;animation:sp-draw 1.05s 1s cubic-bezier(.65,0,.35,1) forwards}
      .sp-dot{fill:var(--line);opacity:0;transform-box:fill-box;transform-origin:center;animation:sp-pop .6s .2s cubic-bezier(.16,1,.3,1) forwards}
      .sp-peak{fill:var(--accent);opacity:0;transform-box:fill-box;transform-origin:center;animation:sp-pop .7s 1.45s cubic-bezier(.16,1,.3,1) forwards}
      .sp-name{margin:22px 0 0;font-size:46px;line-height:1.1;font-weight:600;letter-spacing:-.035em;opacity:0;filter:blur(8px);transform:translateY(10px);animation:sp-rise 1.1s 1.8s cubic-bezier(.16,1,.3,1) forwards}
      .sp-light{font-weight:300}
      .sp-sub{margin:10px 0 0;font-size:15px;letter-spacing:-.005em;color:var(--muted);opacity:0;transform:translateY(6px);animation:sp-rise2 1s 2.25s cubic-bezier(.16,1,.3,1) forwards}
      .sp-bar{margin-top:34px;width:140px;height:2px;border-radius:2px;background:var(--track);overflow:hidden;opacity:0;animation:sp-fade .8s 2s ease forwards}
      .sp-bar i{display:block;height:100%;width:100%;background:var(--accent);border-radius:2px;transform-origin:left;transform:scaleX(0);animation:sp-fill 3.2s 2s cubic-bezier(.3,.1,.2,1) forwards;transition:transform .35s ease}
      #splash.ready .sp-bar i{animation:none;transform:scaleX(1)}
      .sp-credit{position:absolute;bottom:34px;margin:0;font-size:12px;letter-spacing:.04em;color:var(--muted);opacity:0;animation:sp-fade 1.2s 2.5s ease forwards}
      @keyframes sp-draw{to{stroke-dashoffset:0}}
      @keyframes sp-pop{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
      @keyframes sp-lift{to{transform:translateY(-6px)}}
      @keyframes sp-rise{to{opacity:1;filter:blur(0);transform:none}}
      @keyframes sp-rise2{to{opacity:1;transform:none}}
      @keyframes sp-fade{to{opacity:1}}
      @keyframes sp-fill{0%{transform:scaleX(0)}100%{transform:scaleX(.9)}}
      @media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}#splash{transition-duration:.2s}}
      @media (max-width:480px){.sp-name{font-size:38px}.sp-mark{width:200px;height:100px}.sp-sub{font-size:14px;padding:0 24px;text-align:center}}
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-stage">
        <svg class="sp-mark" viewBox="0 0 240 120" width="240" height="120" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path class="sp-line sp-l" pathLength="1" d="M14 60 H96" />
          <path class="sp-line sp-r" pathLength="1" d="M226 60 H144" />
          <path class="sp-pulse" pathLength="1" d="M96 60 H104 L116 22 L128 98 L140 40 L144 60" />
          <circle class="sp-dot sp-d1" cx="14" cy="60" r="4.5" />
          <circle class="sp-dot sp-d2" cx="226" cy="60" r="4.5" />
          <circle class="sp-peak" cx="116" cy="22" r="5" />
        </svg>
        <h1 class="sp-name"><span>Delta</span><span class="sp-light">Trace</span></h1>
        <p class="sp-sub">Trust-aware alarm grouping and tuning for pipelines</p>
        <div class="sp-bar"><i></i></div>
      </div>
      <p class="sp-credit">Created by Kiruthik</p>
    </div>
    <script>try{if(sessionStorage.getItem("deltatrace.splash")){document.getElementById("splash").remove()}else{document.documentElement.classList.add("splash-on")}}catch(e){}</script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
